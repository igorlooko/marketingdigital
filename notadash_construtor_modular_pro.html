<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotaDash - Construtor Modular PRO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 100: '#e0e7ff', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 800: '#3730a3', 900: '#312e81' } }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; overflow: hidden; }
        .grid-stack { min-height: 100%; }
        .grid-stack-item-content { background-color: #1e293b !important; border: 1px solid #334155; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 0 !important; overflow: hidden !important; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .grid-stack-placeholder > .placeholder-content { background-color: rgba(99, 102, 241, 0.15) !important; border: 2px dashed rgba(99, 102, 241, 0.5) !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="h-screen flex selection:bg-brand-500 selection:text-white">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/80 z-20 hidden lg:hidden backdrop-blur-sm transition-opacity" onclick="app.toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 w-72 bg-slate-800 border-r border-slate-700 flex flex-col z-30 transition-transform duration-300 shadow-2xl lg:shadow-none">
        <div class="h-16 px-5 flex items-center justify-between border-b border-slate-700 shrink-0 bg-slate-900/50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center shadow-lg shadow-brand-500/20"><i class="ph-bold ph-squares-four text-white text-lg"></i></div>
                <h1 class="text-xl font-black tracking-tight text-white">NotaDash</h1>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="app.openSettings()" class="text-slate-400 hover:text-white p-1.5 rounded-md hover:bg-slate-700" title="Configurar API Key"><i class="ph-bold ph-gear text-lg"></i></button>
                <button class="lg:hidden text-slate-400 hover:text-white" onclick="app.toggleSidebar()"><i class="ph ph-x text-xl"></i></button>
            </div>
        </div>

        <div class="flex border-b border-slate-700 shrink-0 bg-slate-800">
            <button id="s-tab-workspaces" onclick="app.setSidebarTab('workspaces')" class="flex-1 py-3 text-sm font-bold border-b-2 border-brand-500 text-brand-400 transition-colors">Painéis</button>
            <button id="s-tab-catalog" onclick="app.setSidebarTab('catalog')" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">Catálogo (27)</button>
        </div>

        <!-- Workspaces Tab -->
        <div id="s-content-workspaces" class="flex flex-col flex-1 overflow-hidden p-4">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Meus Workspaces</span>
                <div class="flex items-center gap-1 bg-slate-900/50 p-1 rounded-lg border border-slate-700/50">
                    <button onclick="document.getElementById('import-file').click()" class="text-slate-400 hover:text-brand-400 p-1.5 rounded hover:bg-slate-700" title="Importar JSON"><i class="ph-bold ph-upload-simple"></i></button>
                    <button onclick="app.exportData()" class="text-slate-400 hover:text-brand-400 p-1.5 rounded hover:bg-slate-700" title="Exportar JSON"><i class="ph-bold ph-download-simple"></i></button>
                    <button onclick="app.downloadAIPrompt()" class="text-slate-400 hover:text-purple-400 p-1.5 rounded hover:bg-slate-700" title="Instruções para IA"><i class="ph-bold ph-robot"></i></button>
                    <div class="w-px h-4 bg-slate-700 mx-1"></div>
                    <button onclick="app.prompt('Nome da nova aba:', 'Novo Workspace', (name) => app.addTab(name))" class="text-slate-400 hover:text-emerald-400 p-1.5 rounded hover:bg-slate-700" title="Nova Aba"><i class="ph-bold ph-plus"></i></button>
                </div>
            </div>
            <ul id="tabs-list" class="flex-1 overflow-y-auto space-y-1 no-scrollbar pb-4"></ul>
        </div>

        <!-- Catalog Tab -->
        <div id="s-content-catalog" class="hidden flex-col flex-1 overflow-y-auto no-scrollbar p-4 space-y-6"></div>
    </aside>

    <!-- MAIN AREA -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#0f172a] relative">
        <header class="h-16 flex items-center justify-between px-4 lg:px-6 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 z-10 relative shadow-sm">
            <div class="flex items-center gap-3">
                <button class="lg:hidden text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800" onclick="app.toggleSidebar()"><i class="ph ph-list text-2xl"></i></button>
                <h2 id="current-tab-name" class="text-xl font-bold text-white truncate">Carregando...</h2>
                <div class="flex items-center gap-1" id="tab-actions">
                    <button onclick="app.promptRenameActiveTab()" class="text-slate-400 hover:text-white p-1.5 rounded-md hover:bg-slate-700"><i class="ph-bold ph-pencil-simple"></i></button>
                    <button onclick="app.confirmDeleteActiveTab()" class="text-slate-400 hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/10"><i class="ph-bold ph-trash"></i></button>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-6 no-scrollbar relative" id="main-scroll-area">
            <div class="grid-stack" id="grid-container"></div>
            <div id="empty-state" class="hidden absolute inset-0 flex-col items-center justify-center text-slate-500 pointer-events-none z-0">
                <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4"><i class="ph-bold ph-squares-four text-3xl"></i></div>
                <p class="text-lg font-bold text-slate-300">Workspace Vazio</p>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modal-container" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="UI.closeModal()"></div>
        <div class="relative bg-slate-800 border border-slate-700 shadow-2xl rounded-xl w-full max-w-md p-6 transform transition-all scale-95 opacity-0 flex flex-col max-h-[90vh]" id="modal-box">
            <h3 id="modal-title" class="text-xl font-black text-white mb-2">Título</h3>
            <p id="modal-message" class="text-slate-400 text-sm mb-4 font-medium leading-relaxed">Mensagem</p>
            <input type="text" id="modal-input" class="hidden w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none mb-4">
            <textarea id="modal-textarea" class="hidden w-full h-48 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-emerald-400 font-mono outline-none mb-4 resize-none"></textarea>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="UI.closeModal()" class="px-4 py-2 text-sm font-bold text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-lg">Cancelar</button>
                <button id="modal-btn-confirm" class="px-4 py-2 text-sm font-bold text-white rounded-lg bg-brand-600 hover:bg-brand-500">Confirmar</button>
            </div>
        </div>
    </div>

    <input type="file" id="import-file" class="hidden" accept=".json" onchange="app.handleImport(event)">

    <script>
        window.chartInstances = {};
        window.appIntervals = {};

        const trackInterval = (id, interval) => { window.appIntervals[id] = interval; };
        const clearIntervals = (id) => { if(window.appIntervals[id]) { clearInterval(window.appIntervals[id]); delete window.appIntervals[id]; } };

        const Registry = {
            heading: {
                id: 'heading', name: 'Título', icon: 'ph-text-h', category: '1. Básico', defaultW: 12, defaultH: 2,
                defaultData: () => ({ text: 'Novo Título' }),
                render: (bId, data) => `<div class="w-full h-full p-2 px-4 flex items-center bg-slate-800/80"><input type="text" class="w-full bg-transparent text-2xl font-black text-white outline-none" value="${data.text||''}" oninput="app.updateData('${bId}', { text: this.value })" placeholder="Título..."></div>`
            },
            text: {
                id: 'text', name: 'Anotação', icon: 'ph-text-align-left', category: '1. Básico', defaultW: 4, defaultH: 3,
                defaultData: () => ({ content: 'Ideias...' }),
                render: (bId, data) => `<div class="w-full h-full p-4 outline-none text-slate-200 overflow-y-auto no-scrollbar" contenteditable="true" oninput="app.updateData('${bId}', { content: this.innerHTML })">${data.content}</div>`
            },
            shortcuts: {
                id: 'shortcuts', name: 'Links Rápidos', icon: 'ph-link', category: '1. Básico', headerAction: 'editShortcutsList', defaultW: 4, defaultH: 3,
                defaultData: () => ({ links: [{n: 'Drive', u: '#'}, {n: 'Ads', u: '#'}] }),
                render: (bId, data) => `
                    <div class="grid grid-cols-2 gap-2 p-4 content-start">
                        ${(data.links||[]).map((l) => `
                            <a href="${l.u}" target="_blank" class="flex items-center justify-center bg-slate-800 rounded border border-slate-700 overflow-hidden text-sm font-medium text-center py-2 text-indigo-400 hover:text-white hover:bg-slate-700 transition truncate px-2">${l.n}</a>
                        `).join('')}
                    </div>`
            },
            checklist: {
                id: 'checklist', name: 'Tarefas', icon: 'ph-check-square-offset', category: '2. Produtividade', defaultW: 4, defaultH: 4,
                defaultData: () => ({ items: [] }),
                render: (bId, data) => `
                    <div class="flex flex-col h-full p-4">
                        <ul class="flex-1 overflow-y-auto space-y-1 no-scrollbar">${(data.items||[]).map((item, i) => `
                            <li class="flex items-center gap-2 p-1.5 hover:bg-slate-800 rounded group">
                                <input type="checkbox" ${item.done ? 'checked' : ''} onchange="app.checklistToggle('${bId}', ${i})" class="w-4 h-4 text-brand-500 rounded bg-slate-800 border-slate-600 shrink-0">
                                <input type="text" value="${item.text||''}" oninput="app.checklistEditText('${bId}', ${i}, this.value)" class="flex-1 bg-transparent text-sm font-medium ${item.done ? 'line-through text-slate-500' : 'text-slate-200'} outline-none">
                                <button onclick="app.checklistDel('${bId}', ${i})" class="text-slate-500 hover:text-red-400 shrink-0"><i class="ph-fill ph-trash"></i></button>
                            </li>`).join('')}
                        </ul>
                        <div class="flex gap-2 mt-2 pt-2 border-t border-slate-700">
                            <input type="text" id="chk-${bId}" placeholder="Nova tarefa..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 text-sm text-slate-200 outline-none" onkeydown="if(event.key === 'Enter') { app.checklistAdd('${bId}', this.value); this.value=''; }">
                            <button onclick="const i = document.getElementById('chk-${bId}'); app.checklistAdd('${bId}', i.value); i.value='';" class="bg-brand-600 px-3 rounded text-white"><i class="ph-bold ph-plus"></i></button>
                        </div>
                    </div>`
            },
            kanban: {
                id: 'kanban', name: 'Mini Kanban', icon: 'ph-kanban', category: '2. Produtividade', defaultW: 8, defaultH: 5,
                defaultData: () => ({ cols: [{name: 'A Fazer', items: ['Task 1']}, {name: 'Fazendo', items: []}, {name: 'Feito', items: []}] }),
                render: (bId, data) => `<div class="flex h-full p-3 gap-3 overflow-x-auto bg-slate-900/30">` + (data.cols||[]).map((col, cIdx) => `
                    <div class="flex-1 min-w-[150px] bg-slate-800/80 rounded flex flex-col border border-slate-700/60">
                        <div class="p-2 border-b border-slate-700/60 text-xs font-black text-slate-300 uppercase tracking-wider"><input value="${col.name||''}" class="bg-transparent outline-none w-full" oninput="app.updateData('${bId}', { cols: app.getKanbanData('${bId}', ${cIdx}, 'name', this.value) })"></div>
                        <div class="flex-1 p-2 space-y-2 overflow-y-auto">${(col.items||[]).map((item, iIdx) => `
                            <div class="bg-slate-700 p-2 text-sm text-slate-200 rounded group flex flex-col gap-1">
                                <input type="text" value="${item||''}" class="w-full bg-transparent outline-none text-slate-200 text-sm" oninput="app.updateData('${bId}', { cols: app.getKanbanData('${bId}', ${cIdx}, 'item', this.value, ${iIdx}) })">
                                <div class="flex justify-between items-center pt-1 border-t border-slate-600/50">
                                    ${cIdx > 0 ? `<button onclick="app.moveKanban('${bId}', ${cIdx}, ${iIdx}, -1)" class="text-brand-400 text-xs font-bold hover:underline">← Mover</button>` : '<div></div>'}
                                    <button onclick="app.delKanban('${bId}', ${cIdx}, ${iIdx})" class="text-red-400"><i class="ph-bold ph-trash"></i></button>
                                    ${cIdx < data.cols.length - 1 ? `<button onclick="app.moveKanban('${bId}', ${cIdx}, ${iIdx}, 1)" class="text-brand-400 text-xs font-bold hover:underline">Mover →</button>` : '<div></div>'}
                                </div>
                            </div>`).join('')}
                        </div>
                        <div class="p-2 bg-slate-800/50"><input type="text" placeholder="+ Tarefa" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs outline-none text-white" onkeydown="if(event.key==='Enter'){app.addKanban('${bId}', ${cIdx}, this.value); this.value='';}"></div>
                    </div>`).join('') + `</div>`
            },
            pomodoro: {
                id: 'pomodoro', name: 'Pomodoro', icon: 'ph-timer', category: '2. Produtividade', defaultW: 3, defaultH: 3,
                defaultData: () => ({ left: 25 * 60, run: false, m: 'f' }),
                render: (bId, data) => {
                    const min = Math.floor(data.left / 60).toString().padStart(2, '0');
                    const sec = (data.left % 60).toString().padStart(2, '0');
                    return `
                    <div class="flex flex-col items-center justify-center h-full gap-3">
                        <div class="flex gap-2 bg-slate-900 p-1 rounded border border-slate-700">
                            <button onclick="app.setTimer('${bId}','f')" class="px-2 py-1 text-xs font-bold rounded ${data.m==='f'?'bg-brand-500 text-white':'text-slate-400'}">25m</button>
                            <button onclick="app.setTimer('${bId}','b')" class="px-2 py-1 text-xs font-bold rounded ${data.m!=='f'?'bg-emerald-500 text-white':'text-slate-400'}">5m</button>
                        </div>
                        <div class="text-5xl font-black tabular-nums text-white">${min}:${sec}</div>
                        <div class="flex gap-2">
                            <button onclick="app.toggleTimer('${bId}')" class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center"><i class="ph-fill ${data.run?'ph-pause':'ph-play'} text-lg"></i></button>
                            <button onclick="app.setTimer('${bId}', '${data.m}')" class="w-10 h-10 rounded-full bg-slate-700 text-white flex items-center justify-center"><i class="ph-bold ph-arrow-counter-clockwise text-lg"></i></button>
                        </div>
                    </div>`;
                },
                onDestroy: (bId) => clearIntervals(bId)
            },
            metrics: {
                id: 'metrics', name: 'Métrica (KPI)', icon: 'ph-trend-up', category: '3. Marketing & Dados', defaultW: 3, defaultH: 2,
                defaultData: () => ({ label: 'Custo por Lead', value: 'R$ 4,50' }),
                render: (bId, data) => `
                    <div class="flex flex-col justify-center h-full p-4">
                        <input class="bg-transparent text-xs text-slate-400 outline-none uppercase font-black" value="${data.label||''}" oninput="app.updateData('${bId}', { label: this.value })">
                        <input class="bg-transparent text-3xl font-black text-brand-400 outline-none" value="${data.value||''}" oninput="app.updateData('${bId}', { value: this.value })">
                    </div>`
            },
            chart: {
                id: 'chart', name: 'Graf. Barras', icon: 'ph-chart-bar', category: '3. Marketing & Dados', headerAction: 'editChartData', defaultW: 6, defaultH: 4,
                defaultData: () => ({ labels: ['Jan', 'Fev', 'Mar'], values: [10, 20, 15] }),
                render: (bId) => `<div class="p-4 h-full relative"><canvas id="c-${bId}"></canvas></div>`,
                onMount: (bId, data) => app.initChart(bId, 'bar', data)
            },
            donut_chart: {
                id: 'donut_chart', name: 'Graf. Pizza', icon: 'ph-chart-pie-slice', category: '3. Marketing & Dados', headerAction: 'editChartData', defaultW: 4, defaultH: 4,
                defaultData: () => ({ labels: ['Insta', 'Google'], values: [60, 40] }),
                render: (bId) => `<div class="p-4 h-full relative"><canvas id="c-${bId}"></canvas></div>`,
                onMount: (bId, data) => app.initChart(bId, 'doughnut', data)
            },
            funnel: {
                id: 'funnel', name: 'Funil', icon: 'ph-funnel', category: '3. Marketing & Dados', headerAction: 'editChartData', defaultW: 4, defaultH: 5,
                defaultData: () => ({ steps: [{n: 'Visitas', v: 1000}, {n: 'Leads', v: 100}] }),
                render: (bId, data) => {
                    const steps = data.steps || [];
                    const max = Math.max(...steps.map(s=>s.v), 1);
                    return `<div class="flex flex-col h-full p-4 gap-2 justify-center items-center">` + steps.map((s) => `
                        <div class="w-full text-center bg-brand-600 rounded flex flex-col justify-center" style="width: ${Math.max(20, (s.v/max)*100)}%; height: 50px;">
                            <div class="text-[10px] font-black uppercase text-brand-200">${s.n}</div>
                            <div class="text-lg font-black text-white">${s.v}</div>
                        </div>`).join('') + `</div>`;
                }
            },
            budget: {
                id: 'budget', name: 'Orçamento', icon: 'ph-wallet', category: '3. Marketing & Dados', defaultW: 4, defaultH: 3,
                defaultData: () => ({ total: 1000, spent: 300, name: 'Campanha X' }),
                render: (bId, data) => {
                    const pct = Math.min(((data.spent||0)/(data.total||1))*100, 100)||0;
                    return `<div class="flex flex-col justify-center h-full p-4 gap-2">
                        <input class="bg-transparent font-bold text-center text-slate-300 outline-none" value="${data.name||''}" oninput="app.updateData('${bId}',{name:this.value})">
                        <div class="flex justify-between text-xs text-slate-400">
                            Gasto: <input type="number" class="w-16 bg-transparent border-b border-slate-600 text-white outline-none" value="${data.spent||0}" oninput="app.updateData('${bId}',{spent:Number(this.value)})" onchange="app.refreshBlock('${bId}')">
                            Verba: <input type="number" class="w-16 bg-transparent border-b border-slate-600 text-white outline-none" value="${data.total||0}" oninput="app.updateData('${bId}',{total:Number(this.value)})" onchange="app.refreshBlock('${bId}')">
                        </div>
                        <div class="h-4 bg-slate-800 rounded-full border border-slate-700 overflow-hidden"><div class="h-full transition-all ${pct>90?'bg-red-500':'bg-emerald-500'}" style="width:${pct}%"></div></div>
                    </div>`;
                }
            },
            ab_test: {
                id: 'ab_test', name: 'Teste A/B', icon: 'ph-scales', category: '3. Marketing & Dados', defaultW: 5, defaultH: 4,
                defaultData: () => ({ vA: 1000, cA: 50, vB: 1000, cB: 70 }),
                render: (bId, data) => {
                    const crA = data.vA > 0 ? ((data.cA/data.vA)*100).toFixed(1) : 0;
                    const crB = data.vB > 0 ? ((data.cB/data.vB)*100).toFixed(1) : 0;
                    const winA = parseFloat(crA) > parseFloat(crB);
                    const winB = parseFloat(crB) > parseFloat(crA);
                    return `<div class="p-4 h-full flex flex-col gap-3 justify-center">
                        <div class="grid grid-cols-2 gap-4 text-center">
                            <div class="bg-slate-800/50 p-2 border ${winA?'border-emerald-500':'border-slate-700'} rounded">
                                <div class="text-[10px] font-black text-slate-400 mb-1">VARIANTE A</div>
                                Vis: <input type="number" class="w-12 bg-transparent border-b border-slate-600 text-white text-xs outline-none" value="${data.vA||0}" oninput="app.updateData('${bId}',{vA:Number(this.value)})" onchange="app.refreshBlock('${bId}')"><br>
                                Conv: <input type="number" class="w-12 bg-transparent border-b border-slate-600 text-white text-xs outline-none" value="${data.cA||0}" oninput="app.updateData('${bId}',{cA:Number(this.value)})" onchange="app.refreshBlock('${bId}')">
                                <div class="text-xl font-black mt-2 ${winA?'text-emerald-400':'text-slate-300'}">${crA}%</div>
                            </div>
                            <div class="bg-slate-800/50 p-2 border ${winB?'border-emerald-500':'border-slate-700'} rounded">
                                <div class="text-[10px] font-black text-slate-400 mb-1">VARIANTE B</div>
                                Vis: <input type="number" class="w-12 bg-transparent border-b border-slate-600 text-white text-xs outline-none" value="${data.vB||0}" oninput="app.updateData('${bId}',{vB:Number(this.value)})" onchange="app.refreshBlock('${bId}')"><br>
                                Conv: <input type="number" class="w-12 bg-transparent border-b border-slate-600 text-white text-xs outline-none" value="${data.cB||0}" oninput="app.updateData('${bId}',{cB:Number(this.value)})" onchange="app.refreshBlock('${bId}')">
                                <div class="text-xl font-black mt-2 ${winB?'text-emerald-400':'text-slate-300'}">${crB}%</div>
                            </div>
                        </div>
                    </div>`;
                }
            },
            roi_calc: {

        const UI = {
            showModal: ({ title, message, showInput=false, isTextarea=false, inputDefault='', onConfirm }) => {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').innerHTML = message;
                const i = document.getElementById('modal-input'); const t = document.getElementById('modal-textarea');
                i.classList.add('hidden'); t.classList.add('hidden');
                
                const newI = i.cloneNode(true); i.parentNode.replaceChild(newI, i);
                const newT = t.cloneNode(true); t.parentNode.replaceChild(newT, t);
                
                if(showInput){ 
                    if(isTextarea){newT.classList.remove('hidden'); newT.value=inputDefault; setTimeout(()=>newT.focus(),50);} 
                    else {newI.classList.remove('hidden'); newI.value=inputDefault; setTimeout(()=>newI.focus(),50);} 
                }
                
                const handleConfirm = () => { const v=showInput?(isTextarea?newT.value:newI.value).trim():null; if(showInput&&!v)return; onConfirm(v); UI.closeModal(); };
                
                newI.onkeydown = (e) => { if(e.key === 'Enter') handleConfirm(); };
                document.getElementById('modal-btn-confirm').onclick = handleConfirm;

                document.getElementById('modal-container').classList.remove('hidden');
                setTimeout(()=>document.getElementById('modal-box').classList.remove('scale-95','opacity-0'),10);
            },
            closeModal: () => {
                document.getElementById('modal-box').classList.add('scale-95','opacity-0');
                setTimeout(()=>document.getElementById('modal-container').classList.add('hidden'),200);

        };

        const app = {

                try{ const s = localStorage.getItem('nd_v10'); if(s) app.state=JSON.parse(s); else app.state=app.getInitState(); }catch(e){ app.state=app.getInitState(); }
                if(!app.state.tabs || !app.state.tabs.length) app.state=app.getInitState(); 
                if(!app.state.activeTabId || !app.state.tabs.find(t=>t.id===app.state.activeTabId)) app.state.activeTabId=app.state.tabs[0].id;
                
                app.grid = GridStack.init({ column:12, cellHeight:80, margin:12, handle:'.drag-handle', float:false, animate:true }, '#grid-container');
                app.grid.on('change', (e, items) => { if(items) items.forEach(i => { const b=app.getActiveTab().blocks.find(x=>x.id===i.id); if(b) b.grid={x:i.x,y:i.y,w:i.w,h:i.h}; }); app.save(); });
                app.grid.on('resizestop', (e, el) => { const id=el.getAttribute('gs-id'); const b=app.getActiveTab().blocks.find(x=>x.id===id); if(b&&Registry[b.type].onMount) Registry[b.type].onMount(id,b.data); });
                app.renderPicker(); app.renderTabs(); app.renderDash();

            getInitState: () => ({ tabs: [{ id:'t_1', name:'Dashboard', blocks:[{id:'b_1',type:'metrics',grid:{w:3,h:2},data:Registry.metrics.defaultData()}] }], activeTabId:'t_1', apiKey: '' }),
            save: () => localStorage.setItem('nd_v10', JSON.stringify(app.state)),
            getActiveTab: () => {
                if (!app.state || !app.state.tabs) return null;
                let t = app.state.tabs.find(x => x.id === app.state.activeTabId);
                if (!t && app.state.tabs.length > 0) {
                    app.state.activeTabId = app.state.tabs[0].id;
                    t = app.state.tabs[0];
                }
                return t;
            },

            openSettings: () => {
                UI.showModal({
                    title: 'Configurar Chave da API (Gemini)',
                    message: 'Insira sua chave da API do Google Gemini para habilitar o Chat IA real.',
                    showInput: true,
                    inputDefault: app.state.apiKey || '',
                    onConfirm: (key) => {
                        app.state.apiKey = key;
                        app.save();
                    }
                });
            },

            updateData: (bId, d) => { const b = app.getActiveTab()?.blocks.find(x=>x.id===bId); if(b){ b.data={...b.data,...d}; app.save(); } },
            updateArrData: (bId, k, i, v) => { const b = app.getActiveTab()?.blocks.find(x=>x.id===bId); if(b){ b.data[k][i]=v; app.save(); } },
            refreshBlock: (bId) => { const b=app.getActiveTab()?.blocks.find(x=>x.id===bId); if(b){ const c=document.getElementById(`content-${bId}`); if(c){ c.innerHTML=Registry[b.type].render(bId,b.data); if(Registry[b.type].onMount) Registry[b.type].onMount(bId,b.data); } } },
            
            checklistAdd: (id, t) => { if(t.trim()){ const b=app.getActiveTab().blocks.find(x=>x.id===id); if(!b.data.items)b.data.items=[]; b.data.items.push({text:t,done:false}); app.save(); app.refreshBlock(id); setTimeout(()=>document.getElementById(`chk-${id}`)?.focus(), 10); } },
            checklistEditText: (id, i, val) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); if(b && b.data.items[i]){ b.data.items[i].text = val; app.save(); } },
            checklistToggle: (id, i) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); if(b && b.data.items[i]){ b.data.items[i].done = !b.data.items[i].done; app.save(); app.refreshBlock(id); } },
            checklistDel: (id, i) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); if(b && b.data.items){ b.data.items.splice(i,1); app.save(); app.refreshBlock(id); } },
            
            getKanbanData: (bId, cIdx, prop, val, iIdx=0) => { const cols=app.getActiveTab().blocks.find(x=>x.id===bId).data.cols; if(prop==='name')cols[cIdx].name=val; else cols[cIdx].items[iIdx]=val; return cols; },
            addKanban: (id, c, t) => { if(t.trim()){ const b=app.getActiveTab().blocks.find(x=>x.id===id); if(!b.data.cols[c].items)b.data.cols[c].items=[]; b.data.cols[c].items.push(t); app.save(); app.refreshBlock(id); } },
            delKanban: (id, c, i) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); b.data.cols[c].items.splice(i,1); app.save(); app.refreshBlock(id); },
            moveKanban: (id, c, i, d) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); const it=b.data.cols[c].items.splice(i,1)[0]; b.data.cols[c+d].items.push(it); app.save(); app.refreshBlock(id); },
            
            setTimer: (id, m) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); clearIntervals(id); b.data.m=m; b.data.left=(m==='f'?25:5)*60; b.data.run=false; app.save(); app.refreshBlock(id); },
            toggleTimer: (id) => { const b=app.getActiveTab().blocks.find(x=>x.id===id); b.data.run=!b.data.run; if(b.data.run) trackInterval(id, setInterval(()=>{if(b.data.left>0){b.data.left--;app.save();app.refreshBlock(id);}else{clearIntervals(id);b.data.run=false;app.save();app.refreshBlock(id);}},1000)); else clearIntervals(id); app.save(); app.refreshBlock(id); },
            
            startCountdown: (id, target) => {
                const el = document.getElementById(`cd-${id}`); const eT = new Date(target).getTime();
                trackInterval(id, setInterval(()=>{ const d=eT-new Date().getTime(); if(d<0){if(el)el.innerHTML="EXPIRADO"; clearIntervals(id); return;}
                if(el) el.innerHTML=`${Math.floor(d/86400000)}d ${Math.floor((d%86400000)/3600000)}h ${Math.floor((d%3600000)/60000)}m`; }, 1000));
            },
            startClock: (id) => {
                trackInterval(id, setInterval(()=>{ const el=document.getElementById(`cl-${id}`); if(!el)return; const d=new Date(); const o={hour:'2-digit',minute:'2-digit'};
                el.innerHTML=`<div class="text-center"><div class="text-[10px] text-slate-500 font-black">BR</div><div class="font-black text-white">${d.toLocaleTimeString('pt-BR',{...o,timeZone:'America/Sao_Paulo'})}</div></div>
                <div class="text-center"><div class="text-[10px] text-slate-500 font-black">NY</div><div class="font-black text-white">${d.toLocaleTimeString('en-US',{...o,timeZone:'America/New_York'})}</div></div>
                <div class="text-center"><div class="text-[10px] text-slate-500 font-black">UK</div><div class="font-black text-white">${d.toLocaleTimeString('en-GB',{...o,timeZone:'Europe/London'})}</div></div>`; }, 1000));
            },

            editShortcutsList: (id) => {
                const b = app.getActiveTab().blocks.find(x => x.id === id);
                let txt = '';
                (b.data.links || []).forEach(l => txt += `${l.n}, ${l.u}\n`);
                UI.showModal({
                    title: 'Editar Links Rápidos', 
                    message: 'Formato: Nome, URL (uma por linha)', 
                    showInput: true, 
                    isTextarea: true, 
                    inputDefault: txt, 
                    onConfirm: (v) => {
                        const nl = [];
                        v.split('\n').forEach(l => {
                            const idx = l.indexOf(',');
                            if (idx !== -1) {
                                nl.push({n: l.substring(0, idx).trim(), u: l.substring(idx + 1).trim()});
                            } else if (l.trim()) {
                                nl.push({n: l.trim(), u: '#'});
                            }
                        });
                        app.updateData(id, {links: nl});
                        app.refreshBlock(id);
                    }
                });
            },

            updateSeo: (bId, i) => { const b=app.getActiveTab().blocks.find(x=>x.id===bId); b.data.i[i].d=!b.data.i[i].d; app.save(); app.refreshBlock(bId); },
            
            sendGeminiChat: async (bId) => {
                const inp = document.getElementById(`chat-in-${bId}`); const v = inp.value; if(!v)return; inp.value='';
                const b = app.getActiveTab().blocks.find(x=>x.id===bId); b.data.msgs.push({r:'user',t:v}); app.save(); app.refreshBlock(bId);
                setTimeout(()=>document.getElementById(`chat-in-${bId}`)?.focus(), 50);
                
                if(!app.state.apiKey) {
                    b.data.msgs.push({r:'ai',t:'Erro: Chave da API não configurada. Clique na engrenagem ⚙️ no menu lateral e adicione sua API Key.'});
                    app.save(); app.refreshBlock(bId);
                    setTimeout(()=>document.getElementById(`chat-in-${bId}`)?.focus(), 50);
                    return;
                }

                b.data.msgs.push({r:'ai',t:'Pensando...'});
                app.save(); app.refreshBlock(bId);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${app.state.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: v }] }] })
                    });
                    const data = await response.json();
                    b.data.msgs.pop();
                    if(data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        b.data.msgs.push({r:'ai',t:reply});
                    } else {
                        b.data.msgs.push({r:'ai',t:'Erro ao processar resposta da API.'});
                    }
                } catch(e) {
                    b.data.msgs.pop();
                    b.data.msgs.push({r:'ai',t:'Erro de conexão com a API.'});
                }
                app.save(); app.refreshBlock(bId);
                setTimeout(()=>document.getElementById(`chat-in-${bId}`)?.focus(), 50);
            },

            initChart: (id, t, d) => { setTimeout(()=>{ const c=document.getElementById(`c-${id}`); if(!c)return; if(window.chartInstances[id])window.chartInstances[id].destroy(); window.chartInstances[id]=new Chart(c.getContext('2d'),{type:t,data:{labels:d.labels,datasets:[{data:d.values,backgroundColor:['#6366f1','#ec4899','#14b8a6','#f59e0b']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:t==='doughnut',position:'right',labels:{color:'#94a3b8'}}}}}); }, 50); },
            editChartData: (id) => {
                const b=app.getActiveTab().blocks.find(x=>x.id===id); let txt=''; 
                if(b.type==='funnel') (b.data.steps||[]).forEach(s=>txt+=`${s.n}, ${s.v}\n`); 
                else (b.data.labels||[]).forEach((l,i)=>txt+=`${l}, ${b.data.values[i]}\n`);
                UI.showModal({title:'Editar', message:'Rótulo, Valor', showInput:true, isTextarea:true, inputDefault:txt, onConfirm:(v)=>{
                    const ns=[], nl=[], nv=[]; v.split('\n').forEach(l=>{const p=l.split(','); if(p.length>=2){if(b.type==='funnel')ns.push({n:p[0].trim(),v:parseFloat(p[1])||0}); else{nl.push(p[0].trim());nv.push(parseFloat(p[1])||0);}}});
                    if(b.type==='funnel') app.updateData(id,{steps:ns}); else app.updateData(id,{labels:nl,values:nv});
                    app.refreshBlock(id);
                }});
            },

            genContent: (b) => { const td=Registry[b.type] || {name: 'Bloco', icon: 'ph-square', render: () => ''}; const ac=td.headerAction?`<button onclick="app.${td.headerAction}('${b.id}')" class="text-brand-400 p-1 hover:text-white"><i class="ph-bold ph-gear"></i></button>`:'';
            return `<div class="flex flex-col h-full"><div class="drag-handle h-8 bg-slate-800 flex justify-between items-center px-2 border-b border-slate-700 group"><div class="text-[10px] font-black text-slate-400 uppercase flex items-center gap-1"><i class="ph-bold ${td.icon}"></i> ${td.name}</div><div class="flex items-center gap-1">${ac}<button onclick="app.deleteBlock('${b.id}')" class="text-red-400 p-1 hover:text-red-300"><i class="ph-bold ph-x"></i></button></div></div><div id="content-${b.id}" class="flex-1 overflow-hidden">${td.render(b.id,b.data||{})}</div></div>`; },
            
            renderDash: () => { 
                const t=app.getActiveTab(); 
                if(!t) return;
                document.getElementById('current-tab-name').innerText=t.name; 
                app.grid.removeAll(); 
                if (!t.blocks) t.blocks = [];
                t.blocks.forEach(b=>{ 
                    app.grid.addWidget({id:b.id, x:b.grid?.x, y:b.grid?.y, w:b.grid?.w || 4, h:b.grid?.h || 3, content:app.genContent(b), autoPosition:!b.grid || b.grid.x===undefined}); 
                    if(Registry[b.type] && Registry[b.type].onMount) setTimeout(()=>Registry[b.type].onMount(b.id,b.data),10); 
                }); 
                document.getElementById('empty-state').classList.toggle('hidden', t.blocks.length>0); 
            },

            addBlock: (tId) => { 
                const td=Registry[tId]; 
                const b={id:'b_'+Math.random().toString(36).substr(2,9),type:tId,data:td.defaultData(),grid:{w:td.defaultW,h:td.defaultH}}; 
                app.getActiveTab().blocks.push(b); 
                const el=app.grid.addWidget({id:b.id,w:b.grid.w,h:b.grid.h,content:app.genContent(b),autoPosition:true}); 
                b.grid={x:el.gridstackNode.x,y:el.gridstackNode.y,w:el.gridstackNode.w,h:el.gridstackNode.h}; 
                app.save(); 
                if(td.onMount) setTimeout(()=>td.onMount(b.id,b.data),10); 
                document.getElementById('empty-state').classList.add('hidden'); 
                if(window.innerWidth<1024) app.toggleSidebar(false); 
            },

            deleteBlock: (bId) => { 
                const t=app.getActiveTab(); 
                const b=t.blocks.find(x=>x.id===bId); 
                if(b && Registry[b.type] && Registry[b.type].onDestroy) Registry[b.type].onDestroy(bId); 
                t.blocks=t.blocks.filter(x=>x.id!==bId); 
                app.save(); 
                app.grid.removeWidget(document.querySelector(`[gs-id="${bId}"]`)); 
                document.getElementById('empty-state').classList.toggle('hidden', t.blocks.length>0); 
            },
            
            renderPicker: () => { 
                const c={}; 
                Object.values(Registry).forEach(t=>{if(!c[t.category])c[t.category]=[]; c[t.category].push(t);}); 
                document.getElementById('s-content-catalog').innerHTML = Object.entries(c).map(([cat,ts])=>`<div class="mb-4"><h4 class="text-[10px] font-black text-slate-500 uppercase mb-2 px-1">${cat}</h4><div class="grid grid-cols-2 gap-2">${ts.map(t=>`<button onclick="app.addBlock('${t.id}')" class="flex flex-col items-start p-3 bg-slate-900/40 border border-slate-700/50 hover:border-brand-500/50 rounded-xl transition-all group shadow-sm"><i class="ph-bold ${t.icon} text-2xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i><span class="text-[10px] font-bold text-slate-300">${t.name}</span></button>`).join('')}</div></div>`).join(''); 
            },

            renderTabs: () => { 
                document.getElementById('tabs-list').innerHTML=app.state.tabs.map(t=>{
                    const a=t.id===app.state.activeTabId; 
                    return `<li class="cursor-pointer flex items-center p-2 rounded-r-lg border-l-2 ${a?'bg-brand-500/15 border-brand-500 text-brand-400':'border-transparent text-slate-400 hover:bg-slate-700'}" onclick="app.switchTab('${t.id}')"><i class="ph-bold ${a?'ph-folder-open':'ph-folder'} mr-2"></i><span class="text-sm font-bold truncate">${t.name}</span></li>`;
                }).join(''); 
            },

            switchTab: (id) => { 
                if(app.state.activeTabId===id) return; 
                const current = app.getActiveTab();
                if(current && current.blocks) {
                    current.blocks.forEach(b=>{if(Registry[b.type] && Registry[b.type].onDestroy)Registry[b.type].onDestroy(b.id);});
                }
                app.state.activeTabId=id; 
                app.save(); 
                app.renderTabs(); 
                app.renderDash(); 
                if(window.innerWidth<1024) app.toggleSidebar(false); 
            },

            addTab: (n) => { 
                if(n){
                    const t={id:'t_'+Date.now(),name:n,blocks:[]}; 
                    app.state.tabs.push(t); 
                    app.switchTab(t.id);
                } 
            },

            promptRenameActiveTab: () => { 
                const t=app.getActiveTab(); 
                UI.showModal({title:'Renomear',message:'',showInput:true,inputDefault:t?t.name:'',onConfirm:(v)=>{if(t){t.name=v;app.save();app.renderTabs();document.getElementById('current-tab-name').innerText=v;}}}); 
            },

            confirmDeleteActiveTab: () => { 
                if(app.state.tabs.length<=1) return; 
                UI.showModal({title:'Excluir Aba?',message:'Ação irreversível.',onConfirm:()=>{
                    const t = app.getActiveTab();
                    if(t && t.blocks) t.blocks.forEach(b=>{if(Registry[b.type] && Registry[b.type].onDestroy)Registry[b.type].onDestroy(b.id);}); 
                    app.state.tabs=app.state.tabs.filter(t=>t.id!==app.state.activeTabId); 
                    app.switchTab(app.state.tabs[0].id);
                }}); 
            },
            
            toggleSidebar: (f=null) => { 
                const s=document.getElementById('sidebar'); 
                const o=document.getElementById('sidebar-overlay'); 
                const op=f!==null?f:s.classList.contains('-translate-x-full'); 
                if(op){s.classList.remove('-translate-x-full');o.classList.remove('hidden');}else{s.classList.add('-translate-x-full');o.classList.add('hidden');} 
            },

            setSidebarTab: (id) => { 
                const w = (id === 'workspaces');
                const wsEl = document.getElementById('s-content-workspaces');
                const catEl = document.getElementById('s-content-catalog');
                
                wsEl.classList.toggle('hidden', !w);
                wsEl.classList.toggle('flex', w);
                
                catEl.classList.toggle('hidden', w);
                catEl.classList.toggle('flex', !w);
                
                document.getElementById('s-tab-workspaces').className = `flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${w ? 'border-brand-500 text-brand-400' : 'border-transparent text-slate-400'}`;
                document.getElementById('s-tab-catalog').className = `flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${!w ? 'border-brand-500 text-brand-400' : 'border-transparent text-slate-400'}`;
            },

            prompt: (m,d,cb) => UI.showModal({title:'Ação',message:m,showInput:true,inputDefault:d,onConfirm:cb}),
            
            exportData: () => { 
                const a=document.createElement('a'); 
                a.href=URL.createObjectURL(new Blob([JSON.stringify(app.state, null, 2)],{type:'application/json'})); 
                a.download='notadash.json'; 
                a.click(); 
            },

            handleImport: (e) => { 
                const r=new FileReader(); 
                r.onload=(ev)=>{
                    try{
                        const s=JSON.parse(ev.target.result); 
                        if(s.tabs && Array.isArray(s.tabs)){
                            s.tabs.forEach(t=>{
                                t.id='t_'+Math.random().toString(36).substring(2, 9);
                                if(!t.blocks) t.blocks = [];
                                app.state.tabs.push(t);
                            });
                            app.save();
                            app.renderTabs();
                            app.switchTab(app.state.tabs[app.state.tabs.length - 1].id);
                        }
                    }catch(err){}
                }; 
                r.readAsText(e.target.files[0]); 
                e.target.value=''; 
            },

            downloadAIPrompt: () => { 
                const promptContent = `Você é um Assistente Especialista de Criação de Dashboards para o sistema "NotaDash PRO".
Sua missão é gerar um arquivo JSON perfeitamente formatado que o usuário poderá importar para criar workspaces instantâneos.

REGRAS DO SISTEMA DE GRID:
O sistema utiliza um layout de grade de 12 colunas.
Cada bloco possui um objeto "grid" com: "x" (coluna inicial 0-11), "y" (linha inicial), "w" (largura 1-12) e "h" (altura, geralmente 3 a 6).

ESTRUTURA OBRIGATÓRIA DO JSON:
{
  "tabs": [
    {
      "id": "t_nome_unico",
      "name": "Nome do Workspace",
      "blocks": [
        {
          "id": "b_123",
          "type": "tipo_da_ferramenta",
          "grid": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "data": { ... }
        }
      ]
    }
  ],
  "activeTabId": "t_nome_unico"
}

AS 27 FERRAMENTAS DISPONÍVEIS E SEUS DADOS OBRIGATÓRIOS ("data"):

[Categoria: Básico]
1. heading (Título): {"text": "Seu Título"}
2. text (Anotação): {"content": "Texto livre..."}
3. shortcuts (Links): {"links": [{"n": "Nome", "u": "https://link.com"}]}

[Categoria: Produtividade]
4. checklist (Tarefas): {"items": [{"text": "Fazer X", "done": false}]}
5. kanban (Quadro): {"cols": [{"name": "A Fazer", "items": ["Tarefa 1"]}, {"name": "Feito", "items": []}]}
6. pomodoro (Timer): {"left": 1500, "run": false, "m": "f"}

[Categoria: Marketing & Dados]
7. metrics (KPI Numérico): {"label": "Custo por Clique", "value": "R$ 1,20"}
8. chart (Gráfico Barras): {"labels": ["Jan", "Fev"], "values": [100, 200]}
9. donut_chart (Gráfico Pizza): {"labels": ["Insta", "Google"], "values": [60, 40]}
10. funnel (Funil): {"steps": [{"n": "Impressões", "v": 5000}, {"n": "Cliques", "v": 200}]}
11. budget (Orçamento): {"total": 5000, "spent": 1200, "name": "Google Ads"}
12. ab_test (Teste A/B): {"vA": 1000, "cA": 50, "vB": 1000, "cB": 70}
13. roi_calc (Calculadora ROI): {"inv": 1000, "rev": 2500}
14. ltv_calc (Calculadora LTV): {"ticket": 250, "freq": 4, "anos": 2}
15. lead_score (Termômetro): {"score": 85}

[Categoria: Estratégia & Copy]
16. persona (Avatar): {"n": "Nome", "d": "Dores", "o": "Desejos"}
17. swot (Matriz SWOT): {"s": "Forças", "w": "Fraquezas", "o": "Oportunidades", "t": "Ameaças"}
18. aida (Copy AIDA): {"a": "Atenção", "i": "Interesse", "d": "Desejo", "ac": "Ação"}
19. content_cal (Calendário): {"d": ["Seg: Post X", "Ter: Post Y"]}
20. hashtags (Banco): {"tags": "#marketing #vendas"}
21. seo_checklist (SEO): {"i": [{"t": "Tag H1", "d": true}, {"t": "Imagens", "d": false}]}

[Categoria: Mídia & Ferramentas]
22. embed (Iframe): {"url": "https://site.com"}
23. image (Imagem): {"url": "https://placehold.co/400x300"}
24. countdown (Contagem): {"t": "2027-12-31T23:59", "title": "Lançamento"}
25. clock (Fuso Horário): {}
26. utm_builder (Gerador UTM): {"u": "site.com", "s": "insta", "m": "stories", "c": "promo"}
27. ai_chat (Chat): {"msgs": [{"r": "ai", "t": "Oi!"}]}

INSTRUÇÕES DE RESPOSTA:
Sempre que o usuário pedir um dashboard (ex: "Crie um painel de Gestão de Conteúdo"), crie um layout inteligente na grade de 12 colunas, use as ferramentas corretas de forma harmônica (evite sobreposição horizontal se os 'w' somarem mais que 12 na mesma linha 'y') e preencha o "data" de cada ferramenta com informações criativas e úteis.
RETORNE APENAS O JSON, SEM MARKDOWN, SEM BACKTICKS, SEM TEXTO ADICIONAL. APENAS O CÓDIGO PURO.`;

                const a=document.createElement('a'); 
                a.href=URL.createObjectURL(new Blob([promptContent],{type:'text/plain'})); 
                a.download='Instrucoes_IA_NotaDash.txt'; 
                a.click(); 
            }
        };

        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
